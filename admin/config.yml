backend:
  name: git-gateway
  branch: main

media_folder: "realizace"
public_folder: "realizace"

locale: 'cs'

collections:
  - name: "realizace"
    label: "Realizace"
    label_singular: "Realizace"
    folder: "_realizace"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Název projektu", name: "title", widget: "string", hint: "Např: Rekonstrukce RD — Praha Barrandov"}
      - {label: "Lokalita", name: "lokalita", widget: "string", hint: "Např: Praha – Barrandov"}
      - label: "Kategorie"
        name: "kategorie"
        widget: "select"
        options:
          - {label: "Hrubá stavba", value: "hrube"}
          - {label: "Rekonstrukce", value: "rekonstrukce"}
          - {label: "Fasáda & zateplení", value: "fasady"}
          - {label: "Sádrokarton", value: "sdk"}
          - {label: "Přístavba", value: "pristavba"}
          - {label: "Demolice", value: "demolice"}
          - {label: "Ostatní", value: "ostatni"}
      - {label: "Datum dokončení", name: "datum", widget: "string", hint: "Např: Září 2024"}
      - {label: "Krátký popis", name: "popis", widget: "text", hint: "1-2 věty o projektu"}
      - {label: "Podrobnosti", name: "detail", widget: "text", required: false, hint: "Technické detaily, zajímavosti"}
      - {label: "Hlavní fotka", name: "hero", widget: "image", hint: "Nejlepší fotka — zobrazí se jako první"}
      - label: "Další fotky"
        name: "galerie"
        widget: "list"
        required: false
        field: {label: "Fotka", name: "foto", widget: "image"}
